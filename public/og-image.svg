<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img">
  <title>Fabrica 3D — impressão 3D sob medida</title>
  <defs>
    <pattern id="og-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
    <radialGradient id="og-glow" cx="18%" cy="12%" r="52%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0" />
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
      .display { font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; }
      .body { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0d1011" />
  <rect width="1200" height="630" fill="url(#og-glow)" />
  <rect width="1200" height="630" fill="url(#og-grid)" />

  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
